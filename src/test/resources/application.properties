# 测试使用独立的内存 H2 库，每个上下文一个库
spring.datasource.url=jdbc:h2:mem:testjob;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# 小容量，方便背压测试快速打满
async-job.max-concurrency=2
async-job.queue-capacity=3
async-job.default-max-attempts=4
async-job.backoff-initial-millis=50
async-job.backoff-multiplier=2.0
async-job.backoff-max-millis=2000
async-job.retry-tick-millis=20
