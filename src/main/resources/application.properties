server.port=${SERVER_PORT:8080}

# H2 文件库：任务记录在进程重启后仍然保留
spring.datasource.url=jdbc:h2:file:./data/asyncjob;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# 异步队列配置
async-job.max-concurrency=4
async-job.queue-capacity=16
async-job.default-max-attempts=4
async-job.backoff-initial-millis=200
async-job.backoff-multiplier=2.0
async-job.backoff-max-millis=5000
async-job.retry-tick-millis=100
